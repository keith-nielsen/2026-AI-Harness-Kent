# /etc/systemd/system/alloy.service.d/kent.conf — installed by install/services/alloy
# Kent configuration for the vendor (Grafana apt) alloy.service, without editing
# the package's /etc/default/alloy or /etc/alloy/config.alloy. ExecStart is
# replaced outright because the vendor unit's EnvironmentFile would override any
# drop-in Environment= values.
[Service]
ExecStart=
ExecStart=/usr/bin/alloy run --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy/data --disable-reporting /etc/kent/alloy/config.alloy
Restart=on-failure
RestartSec=5

# --- Hardening (vendor unit ships none). Reads the journal via the
# systemd-journal group membership the package's postinst grants. ---
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/alloy
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RemoveIPC=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
UMask=0077
