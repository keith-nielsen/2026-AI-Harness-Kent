name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck install scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck install/*.sh scripts/*.sh 2>&1 | tee shellcheck.log
          echo "Shellcheck completed (non-fatal)"

  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML configs
        run: |
          python3 -c "
          import yaml, sys, os
          errors = []
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if f.endswith(('.yaml', '.yml')) and not f.startswith('.'):
                      path = os.path.join(root, f)
                      try:
                          with open(path) as fh:
                              yaml.safe_load(fh)
                      except yaml.YAMLError as e:
                          errors.append(f'{path}: {e}')
          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          else:
              print('All YAML files valid')
          "

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile exists
        run: |
          if [ -f templates/Dockerfile.fractal ]; then
            echo "Dockerfile found"
            head -5 templates/Dockerfile.fractal
          else
            echo "No Dockerfile found (OK for architecture-phase)"
          fi

  check-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify essential directories exist
        run: |
          for dir in docs install schemas scripts configs templates skills; do
            if [ -d "$dir" ]; then
              echo "✓ $dir/"
            else
              echo "✗ $dir/ — MISSING"
            fi
          done