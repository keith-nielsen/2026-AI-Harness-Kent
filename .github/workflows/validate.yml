name: Validate

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck service modules and tools
        # SC2034 is excluded: SERVICE is set by each module and consumed by the
        # sourced lib-service.sh, which shellcheck cannot follow.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -e SC2034 \
            install.sh uninstall.sh kent-admin install/services/*.sh install/services/*/*.sh \
            install/services/litellm/kent-litellm-start \
            install/dev/*.sh tests/gent/*.sh

  configs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: YAML, JSON and Python syntax
        run: |
          python3 - <<'PY'
          import json, pathlib, py_compile, sys, yaml
          errors = []
          root = pathlib.Path(".")
          for p in root.rglob("*"):
              if ".git" in p.parts or not p.is_file():
                  continue
              try:
                  if p.suffix in (".yaml", ".yml"):
                      yaml.safe_load(p.read_text())
                  elif p.suffix == ".json":
                      json.loads(p.read_text())
                  elif p.suffix == ".py" or p.name in ("kent-spawn-gent", "kent-destroy-gent", "kent-gent-ctl", "kent-exec", "kent-broker", "kent-broker-client", "kent"):
                      py_compile.compile(str(p), doraise=True)
              except Exception as e:  # noqa: BLE001
                  errors.append(f"{p}: {e}")
          print("\n".join(errors) or "all configs and Python files parse")
          sys.exit(1 if errors else 0)
          PY
      - name: Pinned artifacts
        run: |
          grep -q '^FROM python@sha256:' install/services/gent/image/Dockerfile
          grep -c -- '--hash=sha256:' install/services/litellm/requirements.lock
          grep -c -- '--hash=sha256:' install/services/gent/image/requirements.lock
          for v in PROMETHEUS NODE_EXPORTER LOKI GITEA UV HERMES_UVLOCK TIRITH; do grep -q "^${v}_SHA256=[0-9a-f]\{64\}$" install/services/versions.env; done
          grep -q '^SEARXNG_IMAGE=.*@sha256:[0-9a-f]\{64\}$' install/services/versions.env
          grep -q '^HERMES_COMMIT=[0-9a-f]\{40\}$' install/services/versions.env

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the gateway's locked dependencies + test runner
        run: |
          python -m venv .venv
          .venv/bin/pip install -q --require-hashes -r install/services/litellm/requirements.lock
          .venv/bin/pip install -q "pytest==8.4.2" "pytest-asyncio==1.2.0"
      - name: Unit tests (gateway, kent-core, Gent CEO, install library)
        run: .venv/bin/python -m pytest -q tests/gateway tests/kent_core tests/gent tests/install tests/sim
