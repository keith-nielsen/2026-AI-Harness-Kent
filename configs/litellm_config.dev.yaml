# /etc/litellm/config.dev.yaml
# Kent — Dev Gateway Configuration (RTX 2060 SUPER 8GB)
#
# Architecture:
#   Router  → Qwen2.5-0.5B (CPU via Ollama)
#   Fast    → Qwen2.5-7B Q4_K_M (local GPU via Ollama, mechanical tasks only)
#   Smart   → DeepSeek V4 Flash:free (cloud)
#   Frontier→ DeepSeek V4 Flash:free (cloud, same model for now)
#
# The Arch Router (in the Gent CEO) classifies tasks:
#   confidence >= 0.99 (purely mechanical) → fast
#   confidence < 0.99 (anything else)      → cloud (smart or frontier)

model_list:
  # --- T0 Router (CPU tiny model) ---
  - model_name: "router"
    litellm_params:
      model: "ollama/qwen2.5:0.5b"
      api_base: "http://localhost:11434"

  # --- T1 Fast (local GPU — mechanical tasks via Ollama) ---
  - model_name: "fast"
    litellm_params:
      model: "ollama/qwen2.5:7b-instruct-q4_K_M"
      api_base: "http://localhost:11434"

  # --- T2 Smart (cloud — routine reasoning, free tier) ---
  - model_name: "smart"
    litellm_params:
      model: "deepseek/deepseek-v4-flash:free"
      api_key: "os.environ/DEEPSEEK_API_KEY"

  # --- T3 Frontier (cloud — also flash:free for now) ---
  - model_name: "frontier"
    litellm_params:
      model: "deepseek/deepseek-v4-flash:free"
      api_key: "os.environ/DEEPSEEK_API_KEY"

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 1
  timeout: 120

general_settings:
  master_key: "os.environ/LITELLM_ADMIN_KEY"
  database_url: "os.environ/DATABASE_URL"
  enable_key_tracking: true