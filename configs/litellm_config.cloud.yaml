# /etc/litellm/config.cloud.yaml
# Kent — Inference Gateway Configuration (Cloud)
#
# All tiers routed to a single cloud model for flow testing on
# hardware too limited to run local models with the context sizes
# that Hermes + CrewAI require.
#
# Usage: deploy this as config.yaml when --cloud is set.
#
# Default model: DeepSeek V4 Flash
#   - 284B total / 13B active params, 1M context
#   - ~$0.11/$0.22 per 1M input/output tokens
#   - Strong agentic workflow performance
#   - Supports thinking/non-thinking modes
#
# To use V4 Pro instead (more capable, ~15x the cost), change all
# model values to "deepseek/deepseek-v4-pro".
#
# Requires: DEEPSEEK_API_KEY in environment or secrets.

model_list:
  # All four logical tiers → same physical model.
  # This eliminates model-capability variables from flow testing.
  # Token costs are real — watch your balance.

  - model_name: "router"
    litellm_params:
      model: "deepseek/deepseek-v4-flash"
      api_key: "os.environ/DEEPSEEK_API_KEY"

  - model_name: "fast"
    litellm_params:
      model: "deepseek/deepseek-v4-flash"
      api_key: "os.environ/DEEPSEEK_API_KEY"

  - model_name: "smart"
    litellm_params:
      model: "deepseek/deepseek-v4-flash"
      api_key: "os.environ/DEEPSEEK_API_KEY"
    model_info:
      metadata:
        routing_tier: "primary"

  - model_name: "frontier"
    litellm_params:
      model: "deepseek/deepseek-v4-flash"
      api_key: "os.environ/DEEPSEEK_API_KEY"
    model_info:
      metadata:
        routing_tier: "primary"

  # No Opus 4.7 fallback (key not available)

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  timeout: 180

general_settings:
  master_key: "os.environ/LITELLM_ADMIN_KEY"
  database_url: "os.environ/DATABASE_URL"
  enable_key_tracking: true
