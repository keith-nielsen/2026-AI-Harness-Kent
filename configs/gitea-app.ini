; /etc/kent/gitea/app.ini — installed by install/services/gitea/install.sh
; Kent — Gitea: localhost only, SQLite, no SSH/registration/OAuth2/LFS.
; Secrets are referenced by file (root:gitea 0640), never stored in this file.
APP_NAME = Kent Gitea
RUN_USER = gitea
RUN_MODE = prod
WORK_PATH = /var/lib/gitea

[server]
PROTOCOL = http
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3000
DOMAIN = 127.0.0.1
ROOT_URL = http://127.0.0.1:3000/
APP_DATA_PATH = /var/lib/gitea/data
DISABLE_SSH = true
START_SSH_SERVER = false
OFFLINE_MODE = true
LFS_START_SERVER = false
LFS_JWT_SECRET_URI = file:/etc/kent/gitea/credentials/lfs_jwt_secret

[database]
DB_TYPE = sqlite3
PATH = /var/lib/gitea/data/gitea.db

[repository]
ROOT = /var/lib/gitea/repositories
DEFAULT_BRANCH = main
DEFAULT_PRIVATE = private

[security]
INSTALL_LOCK = true
SECRET_KEY_URI = file:/etc/kent/gitea/credentials/secret_key
INTERNAL_TOKEN_URI = file:/etc/kent/gitea/credentials/internal_token
PASSWORD_HASH_ALGO = argon2

[oauth2]
ENABLED = false
; Gitea still generates this secret and would try to write it into app.ini.
JWT_SECRET_URI = file:/etc/kent/gitea/credentials/jwt_secret

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
DEFAULT_KEEP_EMAIL_PRIVATE = true
ENABLE_NOTIFY_MAIL = false

[mailer]
ENABLED = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[log]
MODE = console
LEVEL = info

[metrics]
ENABLED = true

[cron.update_checker]
ENABLED = false

[session]
PROVIDER = file
PROVIDER_CONFIG = /var/lib/gitea/data/sessions
