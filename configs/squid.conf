# =============================================================================
# Kent — Squid Egress Proxy Configuration
# Purpose: Control outbound HTTP(S) from Gent containers.
# Policy: GET/HEAD allowed to any domain. POST denied by default except
#         allowlisted endpoints. WebSocket blocked.
# =============================================================================

# --- ACLs ---
acl localnet src 172.30.0.0/24          # kent-gent-net Docker bridge
acl localhost src 127.0.0.0/8

acl SSL_ports port 443
acl Safe_ports port 80 443 1025-65535
acl CONNECT method CONNECT

# Methods
acl GET_HEAD method GET HEAD
acl POST method POST
acl PUT method PUT

# POST allowlist (search engines, Gitea)
acl post_allowed_search dstdomain api.duckduckgo.com api.bing.com
acl post_allowed_gitea dst 127.0.0.1
acl post_allowed_gateway dst 127.0.0.1

# --- Access Rules ---

# Deny non-safe ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Allow localhost (host processes) unrestricted
http_access allow localhost

# Gent containers: GET/HEAD to any domain
http_access allow localnet GET_HEAD
http_access allow localnet CONNECT

# Gent containers: POST only to allowlisted endpoints
http_access allow localnet POST post_allowed_search
http_access allow localnet POST post_allowed_gitea
http_access allow localnet POST post_allowed_gateway

# Deny all other POST/PUT from containers
http_access deny localnet POST
http_access deny localnet PUT

# Deny everything else from containers
http_access deny localnet

# Default deny
http_access deny all

# --- Listener ---
http_port 3128

# --- Logging ---
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# --- Performance ---
maximum_object_size 10 MB
cache_dir ufs /var/spool/squid 1000 16 256
coredump_dir /var/spool/squid

# --- Security ---
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
