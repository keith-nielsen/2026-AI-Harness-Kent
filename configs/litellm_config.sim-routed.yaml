# /etc/kent/litellm/config.yaml (sim-routed flavour)
# Kent — SIMULATION gateway with PRODUCTION routing. Used only to try the tiers the way
# they will behave once an Anthropic key is installed (install.sh --config sim-routed);
# never for normal operation.
#
# Same as the prod config except that the ORACLE fixture (tests/sim/oracle.py,
# 127.0.0.1:4010) stands in for both cloud tiers: frontier (Claude Opus 5.5) as model
# oracle-frontier, cheap (DeepSeek V4.1 Flash) as oracle-cheap, so each queued request
# shows which tier sent it. "auto" routes as in prod: default (local, thinking 2048),
# or frontier -> oracle when classified up. The oracle can answer with tool calls,
# so the caller's agent loop runs as it would against the real model. Unlike "sim",
# Kent's interactive agent loop also reaches the oracle when classified up.
# On oracle timeout or failure the usual fallback to the local fast tier applies.

model_list:
  # --- Classify-then-route entry point ---
  - model_name: "auto"
    litellm_params:
      model: "auto_router/complexity_router"
      complexity_router_config:
        classifier_type: "llm"
        classifier_llm_config:
          model: "router"
          # Local model on the 2060: allow for prefill of the rubric + request.
          timeout_ms: 15000
        tier_definitions:
          - name: "fast"
            description: >-
              Routine, mechanical requests with an obvious answer: formatting,
              extraction, short factual lookups, simple rewrites, running a
              single well-specified command, summarising short text.
          - name: "smart"
            description: >-
              Ordinary engineering and knowledge work that needs some reasoning:
              writing or editing code, debugging with clear symptoms, multi-step
              but well-scoped tasks, explanations that need judgement.
          - name: "frontier"
            description: >-
              Hard or high-stakes work: open-ended design and architecture,
              subtle debugging, novel problems, long multi-part reasoning, or
              anything where a wrong answer is costly.
        # Interim (2026-10-17) until the triage step replaces this classifier: nothing goes
        # to thinking off (no classifier is sure enough), so "fast" and "smart" both get the
        # default tier; only frontier escalates.
        tiers:
          fast: "default"
          smart: "default"
          frontier: "frontier"
        # Unclassifiable or failed classification (e.g. the classifier's 15 s timeout while both
        # model slots are busy) goes to the default tier, not the cloud: a timed-out classifier
        # sent a one-line sum to frontier in the 2026-10-17 scratch test. ("fast" is the
        # classifier's label; tiers above maps it to the default model.)
        fallback_tier: "fast"

  # --- T0 Router (local; shares the llama.cpp server until a dedicated router model runs) ---
  - model_name: "router"
    litellm_params:
      model: "openai/locally-run-model"
      api_base: "http://127.0.0.1:8080/v1"
      api_key: "sk-no-key-required"
      # llama.cpp rejects OpenAI params it doesn't implement (e.g. Hermes sends
      # reasoning_effort); drop them for local deployments only.
      drop_params: true
      # Thinking off, explicitly (also the server's default): answers without reasoning.
      extra_body:
        chat_template_kwargs: {enable_thinking: false}

  # --- T1 Fast (local — routine commands) ---
  - model_name: "fast"
    litellm_params:
      model: "openai/locally-run-model"
      api_base: "http://127.0.0.1:8080/v1"
      api_key: "sk-no-key-required"
      # llama.cpp rejects OpenAI params it doesn't implement (e.g. Hermes sends
      # reasoning_effort); drop them for local deployments only.
      drop_params: true
      # Thinking off, explicitly (also the server's default): answers without reasoning.
      extra_body:
        chat_template_kwargs: {enable_thinking: false}

  # --- T2 Default (local, thinking 2048) ---
  # The same local model with thinking turned on per request: no second model, no extra VRAM.
  # Values in extra_body override the caller's (Qwen's thinking-mode sampling); kent_gateway
  # adds thinking_budget_tokens to the caller's max_tokens, since reasoning counts against it.
  # Gents may call the thinking tiers; kent_gateway checks that every Gent call lands on the
  # local model server. Default is where requests go unless a classifier is sure: on the 115
  # bench probes (2026-10-17) thinking 2048 passed 85.8% at 50 s/item, thinking off 77.7% at
  # 19 s (no classifier yet separates the prompts that are safe without thinking).
  - model_name: "default"
    litellm_params:
      model: "openai/locally-run-model"
      api_base: "http://127.0.0.1:8080/v1"
      api_key: "sk-no-key-required"
      # llama.cpp rejects OpenAI params it doesn't implement (e.g. Hermes sends
      # reasoning_effort); drop them for local deployments only.
      drop_params: true
      # Seconds before a default call gives up and falls back to fast (the longest probe
      # answer at this budget took 430 s; 2026-10-17 budget-curve runs).
      timeout: 900
      stream_timeout: 900
      extra_body:
        chat_template_kwargs: {enable_thinking: true}
        thinking_budget_tokens: 2048
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5

  # --- T3 Smart (local, thinking 4096) ---
  # As default with a larger budget: on the 42 hard probes 4096 passed 74.6% vs 65.1% at
  # 2048 (8 vs 20 discordant, p 0.036) and equalled 8192 at 23% less time (2026-10-17).
  - model_name: "smart"
    litellm_params:
      model: "openai/locally-run-model"
      api_base: "http://127.0.0.1:8080/v1"
      api_key: "sk-no-key-required"
      # llama.cpp rejects OpenAI params it doesn't implement (e.g. Hermes sends
      # reasoning_effort); drop them for local deployments only.
      drop_params: true
      # Seconds before a smart call gives up and falls back to fast (the longest probe
      # answer at this budget took 604 s; 2026-10-17 budget-curve runs).
      timeout: 900
      stream_timeout: 900
      extra_body:
        chat_template_kwargs: {enable_thinking: true}
        thinking_budget_tokens: 4096
        temperature: 1.0
        top_p: 0.95
        top_k: 20
        min_p: 0.0
        presence_penalty: 1.5

  # --- T4 Cheap (SIM: oracle; stands in for DeepSeek V4.1 Flash, Kent only) ---
  - model_name: "cheap"
    litellm_params:
      model: "openai/oracle-cheap"
      api_base: "http://127.0.0.1:4010/v1"
      api_key: "sk-oracle-sim"
      # Hermes sends reasoning_effort, which the openai/ provider rejects for an
      # unknown model; without this every call fails at once and falls back to fast.
      drop_params: true
      timeout: 1800
      stream_timeout: 1800

  # --- T5 Frontier (SIM: oracle; Kent only) ---
  - model_name: "frontier"
    litellm_params:
      model: "openai/oracle-frontier"
      api_base: "http://127.0.0.1:4010/v1"
      api_key: "sk-oracle-sim"
      # Hermes sends reasoning_effort, which the openai/ provider rejects for an
      # unknown model; without this every call fails at once and falls back to fast.
      drop_params: true
      timeout: 1800
      stream_timeout: 1800

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 1
  # If a call fails, answer from the local fast tier instead of erroring.
  # Fallbacks match the model name the caller asked for, so "auto" needs its
  # own entry (otherwise a request routed to a failing tier returns 500).
  fallbacks:
    - default: ["fast"]
    - smart: ["fast"]
    - cheap: ["fast"]
    - frontier: ["fast"]
    - auto: ["fast"]
  # Fall back immediately on timeouts and auth/bad-request errors; retry
  # once only where a retry can help (rate limits, provider 5xx). Without
  # this, num_retries multiplies the time before fallback.
  retry_policy:
    TimeoutErrorRetries: 0
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    RateLimitErrorRetries: 1
    InternalServerErrorRetries: 1
  # Local generation on the 2060 runs ~35 tok/s; long answers need headroom.
  timeout: 1800

# Identity-based access, no database: kent_gateway (install/services/litellm/
# kent_gateway.py) maps each key to an identity (operator / kent / gent) and
# the tiers it may call, and logs every call and every denial as JSON to stdout.
# Both LiteLLM switches below are required for LiteLLM to enforce the model
# list; kent_gateway also enforces it itself.
general_settings:
  custom_auth: "kent_gateway.user_api_key_auth"
  custom_auth_run_common_checks: true

litellm_settings:
  enable_post_custom_auth_checks: true
  # activity_logger: per-call JSON to journald; prometheus: /metrics/ for Prometheus
  # (scraped with the "metrics" identity key).
  callbacks: ["kent_gateway.activity_logger", "prometheus"]
